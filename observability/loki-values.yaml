# loki-values.yaml
# Optimized for resource-constrained local Kind cluster log aggregation.
# Configures Loki in single-binary mode with low memory overhead to prevent OOM kills.

loki:
  enabled: true
  isMinio: false
  deploymentMode: SingleBinary

  # Single Binary deployment architecture
  singleBinary:
    replicas: 1
    resources:
      limits:
        cpu: 500m
        memory: 512Mi
      requests:
        cpu: 100m
        memory: 128Mi

  config:
    auth_enabled: false
    server:
      http_listen_port: 3100
      grpc_listen_port: 9095

    common:
      path_prefix: /var/loki
      storage:
        filesystem:
          chunks_directory: /var/loki/chunks
          rules_directory: /var/loki/rules
      replication_factor: 1
      ring:
        kvstore:
          store: inmemory

    schema_config:
      configs:
        - from: 2024-01-01
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: index_
            period: 24h

    limits_config:
      reject_old_samples: true
      reject_old_samples_max_age: 168h
      max_query_length: 24h
      retention_period: 24h

    table_manager:
      retention_deletes_enabled: true
      retention_period: 24h

  persistence:
    enabled: true
    size: 2Gi
    storageClassName: standard

# Promtail daemonset to harvest logs from Kubernetes pod workloads
promtail:
  enabled: true
  config:
    logLevel: info
    serverPort: 3101
    clients:
      - url: http://loki:3100/loki/api/v1/push

  resources:
    limits:
      cpu: 150m
      memory: 128Mi
    requests:
      cpu: 20m
      memory: 32Mi
